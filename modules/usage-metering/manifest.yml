name: usage_metering
description: Adds DB schema primitives for usage event metering
public: false

compatible_templates:
  - async_io_api
  - celery_job_api

requires_modules:
  - api_key_identity_core
conflicts_with: []

create_dirs:
  - src/db
  - alembic/versions

copy_files:
  - source: files/src/db/usage_models.py
    destination: src/db/usage_models.py
  - source: files/src/db/usage_metering.py
    destination: src/db/usage_metering.py
  - source: files/src/db/usage_admin.py
    destination: src/db/usage_admin.py
  - source: files/src/api/models/usage_admin_models.py
    destination: src/api/models/usage_admin_models.py
  - source: files/src/api/routes/usage_admin_routes.py
    destination: src/api/routes/usage_admin_routes.py
  - source: files/alembic/versions/0001_initial.py
    destination: alembic/versions/0001_initial.py
    overwrite: true
  - source: files/alembic/versions/0003_seed_dev_usage_pricing.py
    destination: alembic/versions/0003_seed_dev_usage_pricing.py
  - source: files/src/tests/test_usage_metering.py
    destination: src/tests/test_usage_metering.py
  - source: files/src/tests/test_usage_admin_routes.py
    destination: src/tests/test_usage_admin_routes.py
  - source: files/src/tests/test_usage_admin.py
    destination: src/tests/test_usage_admin.py
  - source: files/src/tests/seed_usage.py
    destination: src/tests/seed_usage.py

patches:
  - strategy: file_append
    target: src/db/models.py
    source: patches/src/db/models.py.append.txt
  - strategy: file_append
    target: src/api/routes/__init__.py
    source: patches/src/api/routes/__init__.py.append.txt
  - strategy: file_append
    target: src/api/models/__init__.py
    source: patches/src/api/models/__init__.py.append.txt
