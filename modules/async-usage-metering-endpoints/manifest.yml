name: async_usage_metering_endpoints
description: Async template integration hooks for usage metering
public: false

compatible_templates:
  - async_io_api

requires_modules:
  - async_identity_core_endpoints
  - usage_metering
conflicts_with: []

copy_files:
  - source: files/src/api/routes/usage_metering_routes.py
    destination: src/api/routes/usage_metering_routes.py

patches:
  - strategy: file_append
    target: src/api/routes/__init__.py
    source: patches/src/api/routes/__init__.py.append.txt
