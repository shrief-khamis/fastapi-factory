name: credit_billing
description: Adds DB schema primitives for credit balances and ledger events
public: false

compatible_templates:
  - async_io_api
  - celery_job_api

requires_modules:
  - usage_metering
conflicts_with: []

create_dirs:
  - src/db
  - alembic/versions

copy_files:
  - source: files/src/db/credit_models.py
    destination: src/db/credit_models.py
  - source: files/src/db/credit_billing.py
    destination: src/db/credit_billing.py
  - source: files/src/db/credit_admin.py
    destination: src/db/credit_admin.py
  - source: files/src/api/models/credit_admin_models.py
    destination: src/api/models/credit_admin_models.py
  - source: files/src/api/routes/credit_admin_routes.py
    destination: src/api/routes/credit_admin_routes.py
  - source: files/alembic/versions/0001_initial.py
    destination: alembic/versions/0001_initial.py
    overwrite: true
  - source: files/alembic/versions/0004_seed_dev_credit_balances.py
    destination: alembic/versions/0004_seed_dev_credit_balances.py
  - source: files/src/tests/test_credit_billing.py
    destination: src/tests/test_credit_billing.py
  - source: files/src/tests/test_credit_admin.py
    destination: src/tests/test_credit_admin.py
  - source: files/src/tests/test_credit_admin_routes.py
    destination: src/tests/test_credit_admin_routes.py
  - source: files/src/tests/seed_credit.py
    destination: src/tests/seed_credit.py

patches:
  - strategy: file_append
    target: src/db/models.py
    source: patches/src/db/models.py.append.txt
  - strategy: file_append
    target: src/api/routes/__init__.py
    source: patches/src/api/routes/__init__.py.append.txt
  - strategy: file_append
    target: src/api/models/__init__.py
    source: patches/src/api/models/__init__.py.append.txt
